name: Life in Numbers

on:
  push:
    branches: [main, staging, dev, ideate, 'claude/**']
    paths:
      - 'apps/life-in-numbers/**'
      - '.github/workflows/life-in-numbers.yml'
  pull_request:
    paths:
      - 'apps/life-in-numbers/**'
      - '.github/workflows/life-in-numbers.yml'

jobs:
  test-and-build:
    name: Test kit & build app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run LifeMetricsKit tests
        run: swift test --package-path apps/life-in-numbers/LifeMetricsKit

      - name: Build app for macOS
        run: >
          xcodebuild build
          -project apps/life-in-numbers/LifeInNumbers/LifeInNumbers.xcodeproj
          -scheme LifeInNumbers
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build app for iOS
        run: >
          xcodebuild build
          -project apps/life-in-numbers/LifeInNumbers/LifeInNumbers.xcodeproj
          -scheme LifeInNumbers
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
