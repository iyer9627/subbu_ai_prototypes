version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai-proto-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ai_prototypes
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai-proto-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-proto-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ai_prototypes?authSource=admin
      - DATABASE_TYPE=mongodb
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ai-proto-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-proto-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - ai-proto-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  ai-proto-network:
    driver: bridge
