AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Prototyping Platform - Lambda Functions

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x
    Environment:
      Variables:
        NODE_ENV: production

Resources:
  AIProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-proto-processing
      CodeUri: lambda/
      Handler: handler.handler
      Events:
        AIProcessingApi:
          Type: Api
          Properties:
            Path: /ai/chat
            Method: POST
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          OPENAI_API_KEY: !Ref OpenAIApiKey
          AI_PROVIDER: anthropic

  AIProcessingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AIProcessingFunction}'
      RetentionInDays: 7

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API Key

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API Key

Outputs:
  AIProcessingApi:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/ai/chat'

  AIProcessingFunction:
    Description: Lambda Function ARN
    Value: !GetAtt AIProcessingFunction.Arn
